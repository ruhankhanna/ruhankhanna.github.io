    <path d="M26.2 38.2 C28.8 41.6 35.2 41.6 37.8 38.2 C35.4 39.4 28.6 39.4 26.2 38.2 Z" fill="#fff" stroke="#6b3d28" stroke-width="1.1" stroke-linejoin="round"/>
