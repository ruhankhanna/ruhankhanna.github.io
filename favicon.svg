    <ellipse cx="26" cy="29.2" rx="1.6" ry="1.9" fill="#1d1916"/>
    <ellipse cx="38" cy="29.2" rx="1.6" ry="1.9" fill="#1d1916"/>
    <circle cx="26.6" cy="28.5" r=".5" fill="#fff"/>
    <circle cx="38.6" cy="28.5" r=".5" fill="#fff"/>
    <!-- nose -->
    <path d="M32 30.5 C31.3 33 30.6 34.4 31.2 35.2 C31.8 35.6 32.8 35.5 33.4 35.1" fill="none" stroke="#8d5b3c" stroke-width="1.2" stroke-linecap="round"/>
