<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background -->
  <circle cx="32" cy="32" r="32" fill="#e8ecfb"/>
  <clipPath id="c"><circle cx="32" cy="32" r="32"/></clipPath>
  <g clip-path="url(#c)">
    <!-- shirt + neck -->
    <path d="M10 66 C12 52 21 47 32 47 C43 47 52 52 54 66 Z" fill="#1f2f5c"/>
    <path d="M27 42 L37 42 L36.5 50 C34.5 52 29.5 52 27.5 50 Z" fill="#9c6a48"/>
