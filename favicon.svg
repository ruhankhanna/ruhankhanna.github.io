    <!-- ears -->
    <ellipse cx="17.6" cy="31" rx="2.6" ry="3.8" fill="#a8734f"/>
    <ellipse cx="46.4" cy="31" rx="2.6" ry="3.8" fill="#a8734f"/>
    <!-- face -->
    <path d="M18.5 27 C18.5 17 24.5 12.5 32 12.5 C39.5 12.5 45.5 17 45.5 27 L45.5 31 C45.5 40.5 39.5 46 32 46 C24.5 46 18.5 40.5 18.5 31 Z" fill="#b47c56"/>
    <!-- hair: dark, full and wavy on top, shorter at the sides -->
    <g fill="#1d1916">
      <path d="M17 29 C15.6 21 17.6 14 23 10.5 L42 10.5 C47 14 48.6 21 47.2 29 C46.4 25 45.4 22.6 44 21.4 C41.6 20.2 37 19 32 19.2 C27 19 22.4 20.2 20 21.4 C18.6 22.6 17.6 25 17 29 Z"/>
      <circle cx="21.5" cy="15.5" r="5.2"/>
      <circle cx="27" cy="10.5" r="6"/>
      <circle cx="33.5" cy="8.6" r="6.4"/>
      <circle cx="40" cy="10.4" r="6"/>
      <circle cx="44.6" cy="15.6" r="4.8"/>
      <circle cx="30" cy="15.5" r="5"/>
      <circle cx="37.5" cy="15.2" r="5"/>
      <!-- a wave falling onto the forehead -->
      <path d="M24.5 17.5 C26.5 21.8 30.5 22.6 33.2 20.6 C31 20.4 29.6 19 29.2 16.8 Z"/>
    </g>
    <path d="M24.6 9.4 C26.4 7.6 29 7 31.2 7.6 M35 5.6 C37.4 5.4 39.8 6.6 41.2 8.4 M28 14.2 C29.6 13 31.8 13 33.2 13.8" fill="none" stroke="#3a322c" stroke-width="1.1" stroke-linecap="round"/>
    <!-- brows -->
    <path d="M23.4 25.2 C25 24.2 27.2 24.1 28.6 24.8" fill="none" stroke="#1d1916" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M35.4 24.8 C36.8 24.1 39 24.2 40.6 25.2" fill="none" stroke="#1d1916" stroke-width="1.7" stroke-linecap="round"/>
